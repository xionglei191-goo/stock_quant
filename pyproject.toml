[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-quant-org"
version = "0.1.0"
description = "A minimal, testable MVP backend for the AI Native virtual quant fund organization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
market-data = ["psycopg[binary]>=3.1", "baostock==0.9.1"]
ui-acceptance = ["Pillow>=10.0"]
test = ["psycopg[binary]>=3.1", "baostock==0.9.1", "Pillow>=10.0"]

[tool.unittest]
test-directory = "tests"
